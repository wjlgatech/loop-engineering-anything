# Cited-repos registry — the ingestion queue for the ecosystem hub factory.
#
# loop-engineering-anything is the HUB of three things: (1) knowledge, (2) tooling,
# (3) experts. This file is the single source of truth (data, not code) for the
# top-rated repos the hub ingests. For each, the factory produces a knowledge graph
# and grade-gated agentic tooling. See docs/plans/2026-07-19-001-ecosystem-hub-factory.md.
#
# Discipline baked into this file (future-proofing, learned the hard way):
#   - PINNED by full 40-char commit SHA (verified 2026-07-19) — never a moving ref.
#     Freshness is a *loop* (poll upstream HEAD, re-pin, re-ingest), not a floating ref.
#   - LICENSE-GATED: a repo with no license (redistribution unclear) is `ingest_kg: true`
#     but `emit_tooling: false` — we may study it, we may NOT ship generated tooling from it.
#   - TIERED: T1 real+top-rated (ingest now) / T2 real+niche (ingest on demand) /
#     T3 seed/fork/self-cited (skip until it earns activity).
#   - Ratings & SHAs are a snapshot; a scheduled cadence re-verifies (see the plan).
