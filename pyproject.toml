[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering-anything"
version = "0.1.0"
description = "A loop orchestrator that turns any target into a self-improving, agent-native CLI by driving generate -> judge -> refactor -> re-judge to convergence."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "wjlgatech" }]
dependencies = [
    "click>=8.1",
    "pyyaml>=6",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff==0.15.18"]

[project.scripts]
loop-anything = "loopeng.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loopeng = ["memory/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Design-fitness complexity budget (plan 2026-06-22 U5). Scoped to the budget
# rule-set ONLY (not ruff's default lint) so the gate stays high-signal; pinned
# above for matrix reproducibility. C901 (cyclomatic) catches god-methods;
# PLR0915 (statements) catches length. PLR0913 (max-args) is deliberately
# EXCLUDED -- wide keyword-only constructors are the protocol-injection idiom.
[tool.ruff]
src = ["src"]

[tool.ruff.lint]
select = ["C901", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 60
